        body {

            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            color: #1a1a24;
        }

        /* Кнопка подписки */
        .btn-push {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: all 0.25s ease;
            margin-bottom: 30px;
        }

        .btn-push:hover {
            background-color: #5b4cc4;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }

        .btn-push:active {
            transform: translateY(1px);
        }

        /* Контейнер для формы встроенного фрейма */
        .form-container {
            background: #fafafa;
            border: 1px solid #edf2f7;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        /* Навигационная ссылка */
        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
            padding: 10px 0;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .nav-link::after {
            content: " →";
            transition: transform 0.2s ease;
        }

        .nav-link:hover::after {
            transform: translateX(4px);
        }
    </style>
